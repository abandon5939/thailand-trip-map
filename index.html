<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>泰国双城：曼谷 → 普吉岛</title>
<meta name="description" content="9月22日–29日 · 曼谷4晚 + 普吉岛3晚 · 8天7晚 · 实战攻略增强版">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
:root {
  --bg-primary:    #ffffff;
  --bg-secondary:  #f5f5f7;
  --bg-tertiary:   #fbfbfd;
  --bg-grouped:    #f2f2f7;
  --bg-elevated:   #ffffff;
  --text-primary:   #1d1d1f;
  --text-secondary: #86868b;
  --text-tertiary:  #aeaeb2;
  --accent:        #0071e3;
  --accent-hover:  #0077ed;
  --tint-red:    #ff3b30;
  --tint-orange: #ff9500;
  --tint-green:  #34c759;
  --tint-blue:   #007aff;
  --tint-purple: #af52de;
  --tint-pink:   #ff2d55;
  --separator:  rgba(60, 60, 67, .12);
  --shadow-sm:  0 1px 3px rgba(0,0,0,.06), 0 1px 2px rgba(0,0,0,.04);
  --shadow-md:  0 4px 14px rgba(0,0,0,.08);
  --shadow-lg:  0 8px 30px rgba(0,0,0,.12);
  --radius-sm:  8px;
  --radius-md:  12px;
  --radius-lg:  16px;
  --radius-xl:  20px;
  --safe-top:    env(safe-area-inset-top, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display",
               "Helvetica Neue", "Arial", sans-serif;
  background: var(--bg-secondary);
  color: var(--text-primary);
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  line-height: 1.47059;
  letter-spacing: -0.022em;
}
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }

#map { width: 100%; height: 40vh; min-height: 280px; position: sticky; top: 0; z-index: 100; }
.locate-btn {
  width: 36px; height: 36px; border-radius: 8px;
  background: rgba(255,255,255,.92); backdrop-filter: blur(8px);
  border: none; box-shadow: 0 1px 4px rgba(0,0,0,.18);
  display: flex; align-items: center; justify-content: center;
  font-size: 18px; cursor: pointer; -webkit-tap-highlight-color: transparent;
}
.locate-btn.active { color: #007aff; }
@keyframes loc-pulse { 0% { transform: scale(1); opacity: .55; } 100% { transform: scale(2.4); opacity: 0; } }
.loc-pulse { width: 14px; height: 14px; border-radius: 50%; background: rgba(0,122,255,.25); animation: loc-pulse 1.6s ease-out infinite; }

.tabs {
  display: flex; gap: 6px; padding: 12px 16px; overflow-x: auto; -webkit-overflow-scrolling: touch;
  background: rgba(255,255,255,.85); -webkit-backdrop-filter: saturate(180%) blur(20px);
  backdrop-filter: saturate(180%) blur(20px); position: sticky; top: 40vh; z-index: 99;
  border-bottom: .5px solid var(--separator); scrollbar-width: none;
}
.tabs::-webkit-scrollbar { display: none; }
.tab {
  flex-shrink: 0; padding: 7px 16px; border-radius: 980px; border: none;
  background: var(--bg-grouped); color: var(--text-secondary);
  font-size: 14px; font-weight: 500; cursor: pointer; transition: all .25s ease;
  white-space: nowrap; letter-spacing: -0.01em;
}
.tab:active { transform: scale(.96); }
.tab.active { background: var(--accent); color: #fff; }

.content { max-width: 680px; margin: 0 auto; padding: 16px 16px calc(24px + var(--safe-bottom)); }

.hero { text-align: center; padding: 28px 20px 20px; }
.hero h1 { font-size: 28px; font-weight: 700; letter-spacing: -0.025em; line-height: 1.15; }
.hero .subtitle { font-size: 17px; color: var(--text-secondary); margin-top: 6px; font-weight: 400; }

.info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 20px; }
.info-card { background: var(--bg-elevated); border-radius: var(--radius-lg); padding: 16px; box-shadow: var(--shadow-sm); }
.info-card .label { font-size: 12px; font-weight: 600; color: var(--text-secondary); text-transform: uppercase; letter-spacing: .02em; margin-bottom: 6px; }
.info-card .value { font-size: 15px; font-weight: 600; line-height: 1.4; }

.section-head { font-size: 13px; font-weight: 600; color: var(--text-secondary); text-transform: uppercase; letter-spacing: .03em; padding: 20px 0 8px; }

.day-head { padding: 20px 0 12px; }
.day-head h2 { font-size: 22px; font-weight: 700; letter-spacing: -0.02em; }
.day-head p { font-size: 15px; color: var(--text-secondary); margin-top: 2px; }

.timeline { position: relative; padding-left: 24px; }
.timeline::before { content: ''; position: absolute; left: 7px; top: 20px; bottom: 20px; width: 1.5px; background: var(--separator); }
.tl-item { position: relative; margin-bottom: 10px; }
.tl-dot { position: absolute; left: -20px; top: 18px; width: 10px; height: 10px; border-radius: 50%; z-index: 1; box-shadow: 0 0 0 3px var(--bg-secondary); }
.tl-dot.food { background: var(--tint-red); }
.tl-dot.spot { background: var(--tint-blue); }
.tl-dot.hotel { background: var(--tint-orange); }
.tl-dot.drink { background: var(--tint-purple); }
.tl-dot.transport { background: var(--text-tertiary); }

.card { background: var(--bg-elevated); border-radius: var(--radius-md); padding: 14px 16px; box-shadow: var(--shadow-sm); transition: box-shadow .25s ease; cursor: pointer; }
.card:active { box-shadow: var(--shadow-md); }
.card .time { font-size: 12px; font-weight: 600; color: var(--text-tertiary); letter-spacing: .01em; }
.card .name { font-size: 17px; font-weight: 600; margin: 2px 0 4px; letter-spacing: -0.01em; display: flex; align-items: center; gap: 6px; }
.card .desc { font-size: 14px; color: var(--text-secondary); line-height: 1.45; }

.badge { display: inline-flex; align-items: center; font-size: 11px; font-weight: 700; padding: 1px 7px; border-radius: 4px; }
.badge.food { background: rgba(255,59,48,.1); color: var(--tint-red); }
.badge.spot { background: rgba(0,122,255,.1); color: var(--tint-blue); }
.badge.drink { background: rgba(175,82,222,.1); color: var(--tint-purple); }

.budget { display: inline-block; margin-top: 6px; padding: 3px 10px; background: var(--bg-grouped); border-radius: var(--radius-sm); font-size: 12px; color: var(--text-secondary); font-weight: 500; }

.pays { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 6px; }
.pay { font-size: 11px; padding: 2px 7px; border-radius: 4px; font-weight: 600; }
.pay.ok { background: rgba(52,199,89,.1); color: var(--tint-green); }
.pay.no { background: rgba(255,59,48,.08); color: var(--tint-red); }
.pay.idk { background: rgba(255,149,0,.1); color: var(--tint-orange); }

.links { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
.btn { display: inline-flex; align-items: center; gap: 4px; padding: 8px 14px; border-radius: var(--radius-sm); font-size: 13px; font-weight: 600; border: none; cursor: pointer; text-decoration: none !important; transition: filter .2s; }
.btn:active { filter: brightness(.9); }
.btn.nav { background: var(--accent); color: #fff; }
.btn.xhs { background: #ff2442; color: #fff; }
.btn.dp { background: #ffa700; color: #fff; }
.btn.rsv { background: var(--tint-green); color: #fff; }

.as-overlay { position: fixed; inset: 0; z-index: 9999; background: rgba(0,0,0,.35); backdrop-filter: blur(2px); display: flex; align-items: flex-end; justify-content: center; opacity: 0; pointer-events: none; transition: opacity .25s; }
.as-overlay.show { opacity: 1; pointer-events: auto; }
.as-sheet { width: 100%; max-width: 420px; padding: 0 8px 34px; transform: translateY(100%); transition: transform .3s cubic-bezier(.22,1,.36,1); }
.as-overlay.show .as-sheet { transform: translateY(0); }
.as-group { background: rgba(255,255,255,.88); backdrop-filter: blur(20px); border-radius: 14px; overflow: hidden; margin-bottom: 8px; }
.as-group .as-item { display: flex; align-items: center; justify-content: center; gap: 8px; padding: 16px; font-size: 18px; color: #007aff; font-weight: 500; border: none; background: none; width: 100%; cursor: pointer; -webkit-tap-highlight-color: transparent; }
.as-group .as-item + .as-item { border-top: .5px solid rgba(0,0,0,.12); }
.as-group .as-item:active { background: rgba(0,0,0,.06); }
.as-cancel { font-weight: 600; }

.details { margin-top: 10px; padding-top: 10px; border-top: .5px solid var(--separator); font-size: 13px; color: var(--text-secondary); line-height: 1.6; }
.details.closed { display: none; }

.day-list .card { margin-bottom: 8px; }
.day-list .card .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; }

.pay-summary { background: var(--bg-elevated); border-radius: var(--radius-md); padding: 14px 16px; box-shadow: var(--shadow-sm); font-size: 13px; line-height: 1.7; margin-bottom: 10px; }
.pay-summary h4 { font-size: 14px; font-weight: 700; margin-bottom: 4px; }
.pay-summary .warn { color: var(--tint-red); }
.pay-summary .ok-text { color: var(--tint-green); }

.tip-card { background: var(--bg-elevated); border-radius: var(--radius-md); padding: 14px 16px; box-shadow: var(--shadow-sm); margin-bottom: 10px; border-left: 3px solid var(--tint-orange); }
.tip-card .tip-title { font-size: 14px; font-weight: 700; margin-bottom: 4px; }
.tip-card .tip-body { font-size: 13px; color: var(--text-secondary); line-height: 1.6; }

.warn-card { background: rgba(255,59,48,.05); border-radius: var(--radius-md); padding: 14px 16px; margin-bottom: 10px; border-left: 3px solid var(--tint-red); font-size: 13px; line-height: 1.6; }
.warn-card .warn-title { font-weight: 700; color: var(--tint-red); margin-bottom: 4px; }

.legend { display: flex; gap: 14px; flex-wrap: wrap; padding: 8px 0; font-size: 12px; color: var(--text-secondary); }
.legend-item { display: flex; align-items: center; gap: 5px; }
.legend-dot { width: 8px; height: 8px; border-radius: 50%; }

.leaflet-popup-content-wrapper { border-radius: var(--radius-md) !important; box-shadow: var(--shadow-lg) !important; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif !important; }
.leaflet-popup-content { font-size: 14px !important; line-height: 1.5 !important; margin: 12px 14px !important; }
.leaflet-popup-content a { color: var(--accent) !important; }
.leaflet-popup-tip { background: #fff !important; }
.leaflet-control-zoom a { width: 34px !important; height: 34px !important; line-height: 34px !important; font-size: 16px !important; border-radius: 10px !important; background: rgba(255,255,255,.85) !important; -webkit-backdrop-filter: blur(10px) !important; backdrop-filter: blur(10px) !important; border: .5px solid var(--separator) !important; color: var(--text-primary) !important; }
.leaflet-control-zoom { border-radius: 12px !important; overflow: hidden; box-shadow: var(--shadow-md) !important; border: none !important; }
.leaflet-control-attribution { font-size: 9px !important; opacity: .5; }
</style>
</head>
<body>

<div id="map"></div>
<div class="tabs" id="tabs"></div>
<div class="content" id="content"></div>

<script>

const HOTEL = { name: '曼谷 · 素坤逸区酒店', lat: 13.7367, lng: 100.5606 };

const DAYS = [
  { id: 0, label: '总览', color: '#0071e3', locations: [] },

  // ═══ D1: 9/22 福州→曼谷 ═══
  { id: 1, label: 'D1 曼谷', date: '9月22日 周二', title: '🛫 福州 → 曼谷', color: '#ff9500', locations: [
    { name: '福州长乐机场 (FOC)', lat: 25.9350, lng: 119.6630, type: 'transport', time: '17:45',
      desc: '春秋航空 9C7301，直飞曼谷素万那普，约3小时50分', budget: '¥500–800/人',
      detail: '每周二、四、六执飞。提前1–2个月订票最划算。⚠️ 春秋座位直角靠背，自备颈枕。行李额需另外购买。昆明中转可更早到（下午两三点就能逛）。', pay: { alipay: 1, wechat: 1, cash: 0.5 }, gmap: 'Fuzhou+Changle+International+Airport' },
    { name: '曼谷素万那普机场 (BKK)', lat: 13.6900, lng: 100.7501, type: 'transport', time: '20:55',
      desc: '抵达曼谷。Grab打车去素坤逸区酒店约40分钟', budget: '打车约300–400THB',
      detail: '💡 入境实战Tips：\n• 每人至少带1万泰铢现金（海关抽查，实测没查但别赌）\n• 提前填线上入境卡（提前1-3天）\n• 准备好英文机票行程单+酒店预订单（海关可能查回程机票）\n• Grab车都香香的，司机心态超好', pay: { cash: 1, card: 0.5 } },
    { name: '素坤逸区酒店', lat: 13.7367, lng: 100.5606, type: 'hotel', time: '22:00',
      desc: '入住素坤逸区，住4晚。出门500米内必有711。推荐小巷子里安静的酒店，有突突车送到BTS站', budget: '¥350–500/晚',
      detail: '💡 素坤逸区（Sukhumvit）是曼谷最方便的住宿区之一。推荐住Asok-Nana之间，500米内必有711（泰国711隔几百米一家，24小时营业，吃喝日用全有）。Agoda比携程/去哪儿都便宜。押金用人民币现金（¥400-700），退房拿走。绝大部分酒店禁榴莲！', pay: { card: 1, alipay: 0.5, cash: 1 }, gmap: 'Sukhumvit+hotel+Bangkok' },
    { name: '素坤逸路深夜街头美食', lat: 13.7370, lng: 100.5580, type: 'food', time: '22:30',
      desc: '🔰 曼谷第一餐！酒店步行5-10分钟，素坤逸路边摊+大排档，芒果糯米饭、泰式炒粉、烤肉串，很多开到凌晨', budget: '¥30–60/人',
      detail: '💡 第一晚别跑远，酒店周边1公里内解决：\n• 素坤逸路沿线随处可见推车摊和路边大排档（深夜都有）\n• 推荐：泰式炒河粉（Pad Thai）、芒果糯米饭、烤肉串、冬阴功汤\n• Foodland Soi 5 的 Took Lae Dee 餐厅24小时营业（约600米）\n• 711也有熟食（炒饭、三明治、热压吐司），半夜饿了随时去\n• 大多数摊位只收现金，711可用支付宝', pay: { cash: 1, alipay: 0.5 }, gmap: 'Sukhumvit+street+food+Bangkok' }
  ]},

  // ═══ D2: 9/23 河畔老城线 ═══
  // 大皇宫→郑王庙→水门寺→唐人街→Iconsiam→蓝旗号→夜游→Terminal21
  // 全程沿湄南河移动，不走回头路
  { id: 2, label: 'D2 曼谷', date: '9月23日 周三', title: '🏯 河畔老城线 · 大皇宫→水门寺→Iconsiam→夜游', color: '#ff9500', locations: [
    { name: '大皇宫 Grand Palace', lat: 13.7500, lng: 100.4914, type: 'spot', time: '09:30',
      desc: '门票฿500含大皇宫+玉面佛+孔剧。⚠️ 不能吊带/短裤，至少八九分裤', budget: '฿500/人',
      detail: '💡 玉面佛里面不让拍照，建筑外可以拍。孔剧要坐车去可以不看。不想进寺庙在门口拍照打卡即可。', pay: { cash: 1 }, gmap: 'Grand+Palace+Bangkok' },
    { name: '郑王庙 (Wat Arun) 河对岸机位', lat: 13.7437, lng: 100.4888, type: 'spot', time: '11:30',
      desc: '大皇宫出来坐渡河船4泰铢到河对岸（Thonburi），不进庙，船上+对岸咖啡馆拍最佳机位', budget: '4THB渡船费',
      detail: '河对岸咖啡馆坐着慢慢拍，穿浅色更出片。⚠️ 白天看一般，今晚夜游时路过看才好看——但白天来这个机位拍照值得。', gmap: 'Wat+Arun+Bangkok' },
    { name: '水门寺大佛 · 拍照机位', lat: 13.7225, lng: 100.4940, type: 'spot', time: '13:00',
      desc: '📸 从郑王庙沿河往南，ins爆火机位！避开水上市场（雷区），定位拍大佛全景', budget: '免费',
      detail: '同在Thonburi河畔，跟郑王庙顺路。那个水上市场水脏商业化，用这个定位点完美避开。水门寺大佛是曼谷新地标。', gmap: 'Wat+Paknam+Bangkok' },
    { name: '唐人街 Yaowarat 午餐', lat: 13.7410, lng: 100.5084, type: 'food', time: '14:30',
      desc: '从水门寺打车10分钟到唐人街。曼谷最有烟火气的美食街午餐版，猪脚饭、烤鱿鱼、泰式炒粉', budget: '¥40–60/人',
      detail: '全熟食没有生食问题。推荐：猪脚饭（Khao Kha Moo）、Yaowarat Toast Bread（烤面包）、泰式炒河粉。白天比晚上人少，不用挤。', pay: { cash: 1 }, gmap: 'Yaowarat+Road+Bangkok+Chinatown' },
    { name: '暹罗天地 Iconsiam', lat: 13.7268, lng: 100.5103, type: 'spot', time: '16:00',
      desc: '🔥 从唐人街打车10分钟到Iconsiam。富人天堂，门口停满豪车，室内水上市场+河景餐厅', budget: '看心情',
      detail: '💡 Iconsiam跟大皇宫/郑王庙/水门寺同在河畔区域，是今天河畔行程的完美收尾。PangCha奶茶有分店。逛到17:00，楼下坐免费接驳船直达Sathorn Pier（5分钟）。', pay: { alipay: 1, wechat: 1, cash: 1 }, gmap: 'Iconsiam+Bangkok' },
    { name: '🧋 PangCha 奶茶', lat: 13.7268, lng: 100.5103, type: 'drink', time: '16:00',
      desc: '🔥 奶茶三巨头之三！Iconsiam内有分店，逛商场顺便喝', budget: '¥15–25', pay: { alipay: 1, cash: 1 }, gmap: 'PangCha+Iconsiam' },
    { name: '蓝旗号出发码头 · 夜游湄南河', lat: 13.7190, lng: 100.5135, type: 'transport', time: '17:15',
      desc: '🌃 从Iconsiam坐免费接驳船到Sathorn Pier。17:50前到，买18:20/30/40班次，必须蓝旗号！二楼右边坐', budget: '约฿200-400/人',
      detail: '💡 Iconsiam接驳船直达Sathorn Pier，无缝衔接。⚠️ 蓝旗号！冲二楼右边！中途像公交一样有人上来，晚了没位。夜景比白天好看10倍。', pay: { cash: 1 }, gmap: 'Sathorn+Pier+Bangkok+night+cruise' },
    { name: '夜游湄南河', lat: 13.7230, lng: 100.5120, type: 'spot', time: '18:30',
      desc: '蓝旗号二楼右边甲板，拍郑王庙+大皇宫夜景+两岸灯光，白天看过的晚上换个角度再看', gmap: 'Chao+Phraya+night+cruise+Bangkok' },
    { name: 'Terminal 21 美食街', lat: 13.7375, lng: 100.5600, type: 'food', time: '20:30',
      desc: '夜游结束BTS Saphan Taksin→Asok顺路回酒店，Pier 21美食广场便宜又地道', budget: '¥30–50/人',
      detail: '五楼Pier 21猪脚饭、泰式炒粉、芒果糯米饭每份30–50THB。吃完走路回酒店5分钟。', pay: { cash: 1 }, gmap: 'Terminal+21+Asok+Bangkok' }
  ]},

  // ═══ D3: 9/24 暹罗商圈线 ═══
  // 百丽宫→手标奶茶→CentralWorld→天桥→四面佛→Big C→朱拉隆功夜市
  // 全程在Siam-Chit Lom-Sam Yan三角区内步行，不用坐车
  { id: 3, label: 'D3 曼谷', date: '9月24日 周四', title: '🛍️ 暹罗商圈线 · 百丽宫→四面佛→Big C→朱拉隆功夜市', color: '#007aff', locations: [

<div class="tip-card"><div class="tip-title">🚗 交通真相</div><div class="tip-body">打车一天约¥100-200，机场到酒店单程约¥200。Grab车都香香的，司机心态超好（堵一小时不按喇叭）。突突车漫天要价别坐。BTS/MRT不互通换乘麻烦，但住BTS站附近有优势。接送机都靠Grab。</div></div>

<div class="tip-card"><div class="tip-title">🍜 奶茶三巨头</div><div class="tip-body">🥇 <strong>手标奶茶 ChaTraMue</strong> — 红泰奶+light sweet三分糖，遍地都是<br>🥈 <strong>猫头鹰奶茶</strong> — 泰奶珍珠奶茶，Grab外卖连点两晚！<br>🥉 <strong>PangCha</strong> — 百丽宫&amp;Iconsiam都有，奶茶界天花板<br>🏅 牛奶小子 Milky Boy — 偏甜旺仔牛奶，斑斓糕好吃</div></div>

// ╔══════════════════════════════════════════════════════════════╗
// ║  ENGINE ║
// ╚══════════════════════════════════════════════════════════════╝

const map = L.map('map', { center: [13.72, 100.55], zoom: 5, zoomControl: false, attributionControl: true });
L.control.zoom({ position: 'topright' }).addTo(map);
L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', { maxZoom: 19 }).addTo(map);

const LocateControl = L.Control.extend({
  options: { position: 'bottomright' },
  onAdd() {
    const btn = L.DomUtil.create('button', 'locate-btn'); btn.innerHTML = '📍'; btn.title = '我的位置';
    L.DomEvent.disableClickPropagation(btn);
    btn.addEventListener('click', () => { btn.classList.add('active'); map.locate({ setView: true, maxZoom: 15 }); });
    this._btn = btn; return btn;
  }
});
new LocateControl().addTo(map);
let locMarker, locCircle;
map.on('locationfound', e => {
  const r = e.accuracy / 2;
  if (locMarker) { locMarker.setLatLng(e.latlng); locCircle.setLatLng(e.latlng).setRadius(r); }
  else {
    locMarker = L.marker(e.latlng, { icon: L.divIcon({ className:'', html:'<div style="width:14px;height:14px;border-radius:50%;background:#007aff;border:2.5px solid #fff;box-shadow:0 0 6px rgba(0,122,255,.5)"></div><div class="loc-pulse" style="position:absolute;top:0;left:0"></div>', iconSize:[14,14], iconAnchor:[7,7] }), zIndexOffset: 2000 }).addTo(map);
    locCircle = L.circle(e.latlng, { radius: r, color: '#007aff', fillColor: '#007aff', fillOpacity: .08, weight: 1 }).addTo(map);
  }
});
map.on('locationerror', () => {});

function icon(color, emoji) {
  return L.divIcon({ className: '', html: `<div style="width:28px;height:28px;border-radius:50%;background:${color};border:2.5px solid #fff;display:flex;align-items:center;justify-content:center;font-size:13px;box-shadow:0 2px 8px rgba(0,0,0,.18)">${emoji||''}</div>`, iconSize: [28,28], iconAnchor: [14,14], popupAnchor: [0,-16] });
}

if (HOTEL.lat) L.marker([HOTEL.lat, HOTEL.lng], { icon: icon('#ff9500','🏨'), zIndexOffset: 1000 }).addTo(map).bindPopup(`<b>${HOTEL.name}</b>`);
L.marker([7.8950, 98.2990], { icon: icon('#ff9500','🏨'), zIndexOffset: 1000 }).addTo(map).bindPopup('<b>普吉 · 芭东酒店</b><br>步行到江西冷，干净舒服');

let markers = [], polylines = [];
const emojis = { food:'🍽️', spot:'📍', hotel:'🏨', transport:'✈️', drink:'🍺' };

function clearMap() { markers.forEach(m=>map.removeLayer(m)); polylines.forEach(p=>map.removeLayer(p)); markers=[]; polylines=[]; }

function showDay(idx) {
  clearMap();
  if (idx === 0) {
    const pts = [];
    DAYS.forEach(d => d.locations.forEach(l => { if(l.lat) pts.push([l.lat,l.lng]); }));
    if(pts.length) map.fitBounds(pts, {padding:[30,30], maxZoom: 7});
    DAYS.slice(1).forEach(d => {
      d.locations.filter(l=>l.time!=='—').forEach(l => {
        const m = L.circleMarker([l.lat,l.lng], { radius:4, fillColor:d.color, color:'#fff', weight:1.5, fillOpacity:.9 }).addTo(map).bindPopup(`<b>${l.name}</b><br><span style="color:#86868b">${d.label}</span>`);
        markers.push(m);
      });
    });
    return;
  }
  const day = DAYS.find(d=>d.id===idx);
  if(!day) return;
  const coords = [];
  day.locations.forEach(l => {
    if(!l.lat) return;
    const m = L.marker([l.lat,l.lng], { icon: icon(day.color, emojis[l.type]||'📌') }).addTo(map);
    const gmapQ = l.gmap||encodeURIComponent(l.name);
    m.bindPopup(`<b>${l.name}</b>${l.time!=='—'?'<br><span style="color:#86868b">'+l.time+'</span>':''}<br>${l.desc}${l.budget?'<br><span style="color:#ff9500">'+l.budget+'</span>':''}<br><a href="#" onclick="event.preventDefault();openAS('${l.name.replace(/'/g,"\\'")}',${l.lat},${l.lng},'${gmapQ}')">📍 导航</a>${l.xhs?' · <a href="'+l.xhs+'" target="_blank">📕 小红书</a>':''}`);
    markers.push(m);
    if(l.time!=='—') coords.push([l.lat,l.lng]);
  });
  if(coords.length>1) { const pl = L.polyline(coords, { color:day.color, weight:2.5, opacity:.5, dashArray:'6,5' }).addTo(map); polylines.push(pl); }
  if(coords.length) map.fitBounds(coords, { padding:[40,40], maxZoom:14 });
}

function payChips(pay) {
  if(!pay) return '';
  let h = '<div class="pays">';
  const m = { cash:'💴现金', card:'💳刷卡', alipay:'支付宝', wechat:'微信' };
  for(const [k,label] of Object.entries(m)) {
    if(pay[k]!==undefined) { const c = pay[k]===1?'ok':pay[k]===0.5?'idk':'no'; h += `<span class="pay ${c}">${label}</span>`; }
  }
  return h+'</div>';
}

const IN_APP_WEBVIEW = (() => {
  const ua = (navigator.userAgent || '').toLowerCase();
  return /micromessenger|xhs|xhsdiscover|discover\/|tiktok|aweme|weibo|qq\/|qqbrowser|alipayclient|dingtalk|lark|feishu|ucbrowser|baiduboxapp|toutiao|newsarticle/.test(ua);
})();

const CITY_CN = {1:'曼谷',2:'曼谷',3:'曼谷',4:'曼谷',5:'普吉岛',6:'普吉岛',7:'普吉岛',8:''};

function makeKeyword(name, dayIdx) {
  const cleaned = name.replace(/⭐.*$/g,'').replace(/（.*?）/g,'').replace(/\(.*?\)/g,'').replace(/\s+/g,' ').trim();
  const city = CITY_CN[dayIdx] || '';
  return city ? `${city} ${cleaned}` : cleaned;
}
function xhsKeyword(loc, dayIdx) { return loc.xhsKeyword ? loc.xhsKeyword.trim() : makeKeyword(loc.name, dayIdx); }
function xhsWebUrl(loc, dayIdx) { return `https://www.xiaohongshu.com/search_result?keyword=${encodeURIComponent(xhsKeyword(loc, dayIdx))}`; }
function xhsAppUrl(loc, dayIdx) { return `xhsdiscover://search/result?keyword=${encodeURIComponent(xhsKeyword(loc, dayIdx))}&target_search=notes&source=deeplink`; }
function dpWebUrl(loc, dayIdx) { return `https://www.dianping.com/search/keyword/1/0_${encodeURIComponent(xhsKeyword(loc, dayIdx))}`; }

function locCard(loc, dayIdx) {
  const dot = loc.type==='food'?'food':loc.type==='spot'?'spot':loc.type==='drink'?'drink':loc.type==='hotel'?'hotel':'transport';
  const bdg = loc.type==='food'?'<span class="badge food">餐</span>':loc.type==='spot'?'<span class="badge spot">景</span>':loc.type==='drink'?'<span class="badge drink">饮</span>':loc.type==='hotel'?'<span class="badge spot">住</span>':'<span class="badge drink">行</span>';
  const uid = `d${dayIdx}-${loc.name.replace(/\W/g,'')}`;
  const gmapQ = loc.gmap||encodeURIComponent(loc.name);
  let lnk = `<button class="btn nav" onclick="openAS('${loc.name.replace(/'/g,"\\'")}',${loc.lat},${loc.lng},'${gmapQ}')">📍 导航</button>`;
  if (loc.xhs) { lnk += `<a href="${loc.xhs}" target="_blank" class="btn xhs">📕 小红书</a>`; }
  else { const appUrl = xhsAppUrl(loc, dayIdx); const webUrl = xhsWebUrl(loc, dayIdx); lnk += `<a href="${appUrl}" class="btn xhs" onclick="setTimeout(function(){window.open('${webUrl}','_blank')},800)">📕 搜攻略</a>`; }
  if (loc.dianping) { lnk += `<a href="${loc.dianping}" target="_blank" class="btn dp">🍜 大众点评</a>`; }
  else if ((loc.type==='food' || loc.type==='drink') && loc.dianping !== false) { lnk += `<a href="${dpWebUrl(loc, dayIdx)}" target="_blank" class="btn dp">🍜 大众点评</a>`; }
  if(loc.reserve) lnk += `<a href="${loc.reserve}" target="_blank" class="btn rsv">📅 预约/预订</a>`;
  return `<div class="tl-item"><div class="tl-dot ${dot}"></div><div class="card" onclick="if(!event.target.closest('.btn,.links'))toggle('${uid}')"><div class="time">${loc.time!=='—'?loc.time:'备选'}</div><div class="name">${bdg} ${loc.name}</div><div class="desc">${loc.desc}</div>${loc.budget?'<div class="budget">'+loc.budget+'</div>':''}${payChips(loc.pay)}<div class="links">${lnk}</div>${loc.detail?'<div class="details" id="'+uid+'">'+loc.detail.replace(/\n/g,'<br>')+'</div>':''}</div></div>`;
}

function renderDay(idx) {
  const d = DAYS.find(x=>x.id===idx); if(!d) return '';
  const main = d.locations.filter(l=>l.time!=='—');
  const alt = d.locations.filter(l=>l.time==='—');
  let h = `<div class="day-head"><h2>${d.title}</h2><p>${d.date}</p></div>`;
  if(main.length) { h += '<div class="timeline">'; main.forEach(l => h += locCard(l, idx)); h += '</div>'; }
  if(alt.length) { h += '<div class="section-head">备选</div><div class="timeline">'; alt.forEach(l => h += locCard(l, idx)); h += '</div>'; }
  return h;
}

let cur = 0;
const tabsEl = document.getElementById('tabs');
const contentEl = document.getElementById('content');

DAYS.forEach(d => {
  const btn = document.createElement('button');
  btn.className = 'tab' + (d.id===0?' active':''); btn.dataset.day = d.id; btn.textContent = d.label;
  tabsEl.appendChild(btn);
});

function go(idx) {
  cur = idx;
  tabsEl.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', +t.dataset.day===idx));
  contentEl.innerHTML = idx===0 ? overviewContent() : renderDay(idx);
  showDay(idx); contentEl.scrollTo({top:0});
  const tab = tabsEl.querySelector(`[data-day="${idx}"]`);
  if(tab) tab.scrollIntoView({behavior:'smooth', inline:'center', block:'nearest'});
}
function toggle(id) { const el=document.getElementById(id); if(el) el.classList.toggle('closed'); }
tabsEl.addEventListener('click', e => { const t=e.target.closest('.tab'); if(t) go(+t.dataset.day); });
go(0);

/* ── Action Sheet ── */
const asOverlay = document.createElement('div');
asOverlay.className = 'as-overlay';
asOverlay.innerHTML = `<div class="as-sheet"><div class="as-group" id="as-opts"></div><div class="as-group"><button class="as-item as-cancel" onclick="closeAS()">取消</button></div></div>`;
document.body.appendChild(asOverlay);
asOverlay.addEventListener('click', e => { if (e.target === asOverlay) closeAS(); });

const IS_IOS = /iPad|iPhone|iPod/.test(navigator.userAgent);
function openAS(name, lat, lng, gmap) {
  const q = gmap || encodeURIComponent(name);
  const encName = encodeURIComponent(name);
  const safeName = name.replace(/'/g,"\\'");
  const appleUrl = IN_APP_WEBVIEW ? `https://maps.apple.com/?q=${lat},${lng}&ll=${lat},${lng}&name=${encName}` : `maps://maps.apple.com/?q=${lat},${lng}&name=${encName}`;
  const googleUrl = `https://www.google.com/maps/search/?api=1&query=${q}`;
  document.getElementById('as-opts').innerHTML =
    `<button class="as-item" onclick="window.open('${appleUrl}');closeAS()">🍎 Apple Maps</button>` +
    `<button class="as-item" onclick="window.open('${googleUrl}');closeAS()">🗺️ Google Maps</button>` +
    `<button class="as-item" onclick="window.open('https://uri.amap.com/marker?position=${lng},${lat}&name=${encName}&src=trip&coordinate=wgs84&callnative=1');closeAS()">🧭 高德地图</button>`;
  asOverlay.classList.add('show');
}
function closeAS() { asOverlay.classList.remove('show'); }
</script>
